    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene1-hero-intro"]';

        const topBar = `${scope} .top-bar`;
        const heroTitle = `${scope} .hero-title`;
        const heroSubtitle = `${scope} .hero-subtitle`;
        const brandTagline = `${scope} .brand-tagline`;
        const specCards = `${scope} .spec-card`;
        const machinery = `${scope} .machinery-card-frame`;
        const reticle = `${scope} .reticle-box`;

        // Initial setup
        tl.set(topBar, { opacity: 0, y: -30 });
        tl.set(brandTagline, { opacity: 0, x: -40 });
        tl.set(heroTitle, { opacity: 0, scale: 0.95, x: -50 });
        tl.set(heroSubtitle, { opacity: 0, y: 30 });
        tl.set(specCards, { opacity: 0, y: 30, stagger: 0.1 });
        tl.set(machinery, { opacity: 0, x: 140, scale: 0.92 });
        tl.set(reticle, { opacity: 0, scale: 0.85 });

        // Animation Entrance
        tl.to(topBar, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
        tl.to(brandTagline, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.to(heroTitle, { opacity: 1, scale: 1, x: 0, duration: 0.9, ease: "power4.out" }, 0.4);
        tl.to(heroSubtitle, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.7);

        tl.to(machinery, { opacity: 1, x: 0, scale: 1, duration: 1.2, ease: "power3.out" }, 0.5);
        tl.to(reticle, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.9);

        tl.to(specCards, { opacity: 1, y: 0, duration: 0.7, stagger: 0.15, ease: "back.out(1.2)" }, 1.1);

        // Subtle camera float
        tl.to(machinery, { y: -15, duration: 2.2, ease: "sine.inOut" }, 1.7);

        // Exit transition smoothly out to Scene 2
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 1.04, duration: 0.5, ease: "power2.in" }, 4.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hero-intro"] = tl;
      })();
