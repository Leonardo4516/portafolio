    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene3-catalog-booking"]';

        const header = `${scope} .scene-header`;
        const browser = `${scope} .browser-frame`;
        const catalogImg = `${scope} .browser-img-catalog`;
        const modal = `${scope} .transaction-modal`;
        const approvedCard = `${scope} .approved-preview-card`;

        // Setup
        tl.set(header, { opacity: 0, y: -20 });
        tl.set(browser, { opacity: 0, x: -80, scale: 0.96 });
        tl.set(modal, { opacity: 0, x: 80, scale: 0.94 });
        tl.set(approvedCard, { opacity: 0, y: 50 });

        // Sequence Entrance
        tl.to(header, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.to(browser, { opacity: 1, x: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0.4);

        // Catalog scroll down simulation
        tl.to(catalogImg, { y: -160, duration: 2.8, ease: "power1.inOut" }, 0.8);

        // Transaction modal pops up
        tl.to(modal, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: "back.out(1.2)" }, 1.0);

        // Conflict check animation pulse
        tl.fromTo(
          `${scope} .conflict-check-bar`,
          { scale: 0.95 },
          { scale: 1.03, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" },
          1.8
        );

        // Approved confirmation preview pops in
        tl.to(approvedCard, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.4);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 1.03, duration: 0.5, ease: "power2.in" }, 5.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene3-catalog-booking"] = tl;
      })();
    </script>
