    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene3-catalog"]';

        const frame = `${scope} .browser-frame`;
        const scrollContainer = `${scope} .scroll-container`;
        const cardFeatured = `${scope} .card-featured`;
        const calloutSpecs = `${scope} .callout-specs`;
        const calloutRates = `${scope} .callout-rates`;

        // Initial setup
        tl.set(frame, { opacity: 0, scale: 0.98 });
        tl.set(scrollContainer, { y: 150 });
        tl.set([calloutSpecs, calloutRates], { opacity: 0, scale: 0.8 });

        // Scroll into catalog
        tl.to(frame, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.to(scrollContainer, { y: 0, duration: 1.2, ease: "power2.out" }, 0.4);

        // Zoom in on the featured CAT 320D card
        tl.to(frame, { scale: 1.22, transformOrigin: "26% 56%", duration: 1.4, ease: "power2.inOut" }, 1.4);

        // Callouts appear
        tl.to(calloutSpecs, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.4);
        tl.to(calloutRates, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 3.1);

        // Zoom back out to general view
        tl.to(frame, { scale: 1, duration: 0.9, ease: "power2.inOut" }, 4.3);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 5.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene3-catalog"] = tl;
