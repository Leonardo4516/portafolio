    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene5-reservation"]';

        const modal = `${scope} .booking-modal-card`;
        const successPopup = `${scope} .booking-success-popup`;
        const calloutLock = `${scope} .callout-lock`;
        const calloutPricing = `${scope} .callout-pricing`;
        const frame = `${scope} .browser-frame`;

        // Initial setup
        tl.set(modal, { opacity: 0, scale: 0.85 });
        tl.set(successPopup, { opacity: 0, scale: 0.9 });
        tl.set([calloutLock, calloutPricing], { opacity: 0, scale: 0.8 });

        // Modal entrance
        tl.to(modal, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.2)" }, 0.2);

        // Zoom in to modal
        tl.to(frame, { scale: 1.08, duration: 1.2, ease: "power2.inOut" }, 0.6);

        // Callouts appear
        tl.to(calloutLock, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.0);
        tl.to(calloutPricing, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.8);

        // Submit action & Success popup
        tl.to(modal, { opacity: 0, scale: 0.96, duration: 0.3 }, 3.2);
        tl.to(successPopup, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 3.3);

        // Zoom back out
        tl.to(frame, { scale: 1, duration: 0.8, ease: "power2.inOut" }, 4.0);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 4.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene5-reservation"] = tl;
      })();
