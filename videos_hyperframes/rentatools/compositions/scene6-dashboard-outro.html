      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene6-dashboard-outro"]';

        const frame = `${scope} .browser-frame`;
        const calloutPdf = `${scope} .callout-pdf`;
        const outroBanner = `${scope} .final-outro-banner`;

        // Initial setup
        tl.set(frame, { opacity: 0, scale: 0.98 });
        tl.set(calloutPdf, { opacity: 0, scale: 0.8 });
        tl.set(outroBanner, { opacity: 0, scale: 0.92 });

        // Table entrance
        tl.to(frame, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.2);

        // Callout appears pointing to PDF contract
        tl.to(calloutPdf, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.6);

        // Outro banner fades in over the dashboard to close the film
        tl.to(outroBanner, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 1.6);

        // Hold until 4.5s

        window.__timelines["scene6-dashboard-outro"] = tl;
