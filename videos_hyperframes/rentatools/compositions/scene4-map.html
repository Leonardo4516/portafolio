    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene4-map"]';

        const frame = `${scope} .browser-frame`;
        const circle = `${scope} .coverage-circle`;
        const glow = `${scope} .coverage-glow`;
        const dispatchLine = `${scope} .dispatch-line`;
        const hud = `${scope} .map-hud-card`;
        const calloutGeofence = `${scope} .callout-geofence`;
        const calloutRoute = `${scope} .callout-route`;

        // Initial setup
        tl.set(frame, { opacity: 0, scale: 0.98 });
        tl.set([circle, glow], { scale: 0.2, transformOrigin: "840px 310px", opacity: 0 });
        tl.set(dispatchLine, { strokeDashoffset: 300, opacity: 0 });
        tl.set(hud, { opacity: 0, y: 30 });
        tl.set([calloutGeofence, calloutRoute], { opacity: 0, scale: 0.8 });

        // Scroll entrance
        tl.to(frame, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0.2);

        // Geofence circle expands
        tl.to([circle, glow], { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 0.5);

        // Vector connects base to site
        tl.to(dispatchLine, { opacity: 1, strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.2);
        tl.to(hud, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.2)" }, 1.5);

        // Camera punches in on the 20km zone
        tl.to(frame, { scale: 1.2, transformOrigin: "52% 48%", duration: 1.4, ease: "power2.inOut" }, 1.8);

        // Callouts appear
        tl.to(calloutGeofence, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.4);
        tl.to(calloutRoute, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 3.1);

        // Zoom back out
        tl.to(frame, { scale: 1, duration: 0.9, ease: "power2.inOut" }, 4.3);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 5.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene4-map"] = tl;
      })();
