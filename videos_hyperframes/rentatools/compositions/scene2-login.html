    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene2-login"]';

        const modal = `${scope} .auth-modal-card`;
        const successCard = `${scope} .login-success-card`;
        const cursor = `${scope} .virtual-cursor`;
        const callout = `${scope} .callout-auth`;
        const navGuest = `${scope} #nav-guest`;
        const navUser = `${scope} #nav-user-logged`;

        // Initial setup
        tl.set(modal, { opacity: 0, scale: 0.85 });
        tl.set(successCard, { opacity: 0, scale: 0.9 });
        tl.set(callout, { opacity: 0, x: -30 });
        tl.set(cursor, { x: 960, y: 540, opacity: 0 });

        // Cursor appears and moves towards "Iniciar Sesión" button
        tl.to(cursor, { opacity: 1, duration: 0.3 }, 0.2);
        tl.to(cursor, { x: 1650, y: 100, duration: 0.8, ease: "power2.out" }, 0.3);

        // Click on login button
        tl.to(cursor, { scale: 0.8, duration: 0.15, yoyo: true, repeat: 1 }, 1.1);

        // Modal opens
        tl.to(modal, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.2)" }, 1.3);

        // Callout appears
        tl.to(callout, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.6);

        // Cursor moves to preset button and clicks
        tl.to(cursor, { x: 960, y: 550, duration: 0.7, ease: "power2.out" }, 1.8);
        tl.to(cursor, { scale: 0.8, duration: 0.12, yoyo: true, repeat: 1 }, 2.5);

        // Cursor moves to submit button and clicks
        tl.to(cursor, { x: 960, y: 670, duration: 0.5, ease: "power2.out" }, 2.7);
        tl.to(cursor, { scale: 0.8, duration: 0.12, yoyo: true, repeat: 1 }, 3.2);

        // Modal closes, success card pops up
        tl.to(modal, { opacity: 0, scale: 0.95, duration: 0.3 }, 3.4);
        tl.to(successCard, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.2)" }, 3.5);

        // Navbar updates to logged-in user
        tl.set(navGuest, { display: "none" }, 3.5);
        tl.set(navUser, { display: "block" }, 3.5);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 1.02, duration: 0.4, ease: "power2.in" }, 4.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2-login"] = tl;
      })();
