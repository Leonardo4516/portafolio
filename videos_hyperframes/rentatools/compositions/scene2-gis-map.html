<template id="scene2-gis-map-template">
  <div
    data-composition-id="scene2-gis-map"
    data-width="1920"
    data-height="1080"
    data-duration="5.5"
  >
    <div class="canvas">
      <!-- Dark GIS Map Canvas Background -->
      <div class="map-container">
        <!-- SVG Tactical Vector Map Lines -->
        <svg class="map-svg" viewBox="0 0 1920 1080" width="1920" height="1080">
          <defs>
            <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
              <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.05" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="zone-glow" cx="50%" cy="50%" r="50%">
              <stop offset="70%" stop-color="#ff3355" stop-opacity="0" />
              <stop offset="95%" stop-color="#ff3355" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#ff3355" stop-opacity="0.4" />
            </radialGradient>
          </defs>

          <!-- Grid Lines -->
          <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
            <line x1="200" y1="0" x2="200" y2="1080" />
            <line x1="600" y1="0" x2="600" y2="1080" />
            <line x1="1000" y1="0" x2="1000" y2="1080" />
            <line x1="1400" y1="0" x2="1400" y2="1080" />
            <line x1="1800" y1="0" x2="1800" y2="1080" />
            <line x1="0" y1="200" x2="1920" y2="200" />
            <line x1="0" y1="500" x2="1920" y2="500" />
            <line x1="0" y1="800" x2="1920" y2="800" />
          </g>

          <!-- Vector Road Network Simulation (Bogotá Corridors) -->
          <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" fill="none">
            <!-- Autonorte / Carrera 30 -->
            <path d="M 960 0 L 980 300 L 960 600 L 910 850 L 860 1080" stroke-dasharray="8 6" />
            <!-- Calle 26 / El Dorado -->
            <path d="M 300 560 L 600 550 L 960 600 L 1400 620 L 1920 640" stroke-dasharray="10 6" />
            <!-- Calle 80 / Autopista Medellín -->
            <path d="M 200 380 L 650 420 L 980 470 L 1500 500" />
            <!-- Av Boyacá / Av 68 -->
            <path d="M 750 150 L 780 450 L 760 750 L 720 1000" stroke="rgba(255, 255, 255, 0.15)" />
            <path d="M 860 200 L 870 500 L 850 800 L 810 1050" stroke="rgba(255, 255, 255, 0.15)" />
          </g>

          <!-- Coverage Zone: 20 KM Dynamic Radius Circle centered at 960, 540 -->
          <circle class="coverage-pulse-ring" cx="960" cy="540" r="380" fill="url(#zone-glow)" stroke="#ff3355" stroke-width="2" stroke-dasharray="12 8" />
          <circle class="coverage-solid-ring" cx="960" cy="540" r="380" fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.6" />

          <!-- Center Dispatch Point (Bogotá D.C.) -->
          <circle cx="960" cy="540" r="8" fill="#ff3355" />
          <circle class="center-radar-wave" cx="960" cy="540" r="40" fill="url(#radar-glow)" stroke="#38bdf8" stroke-width="2" />

          <!-- Haversine Connection Vector from Base to Obra -->
          <line class="haversine-line" x1="960" y1="540" x2="1240" y2="410" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 6" />
        </svg>

        <!-- Dynamic GPS Map Pins -->
        <!-- Pin 1: Center Base -->
        <div class="map-pin pin-center">
          <div class="pin-beacon"></div>
          <div class="pin-label-box" data-layout-ignore="true">
            <span class="pin-title">CENTRO LOGÍSTICO BOGOTÁ</span>
            <span class="pin-coords">4.6097° N, 74.0817° W</span>
          </div>
        </div>

        <!-- Pin 2: Active Jobsite (Obra Calle 170) -->
        <div class="map-pin pin-site">
          <div class="pin-pulse" data-layout-allow-overflow="true"></div>
          <div class="pin-marker"></div>
          <div class="pin-label-box" data-layout-ignore="true">
            <span class="pin-title">OBRA NORTE #170</span>
            <span class="pin-status status-active">RADIO 14.8 KM • DENTRO DE ZONA</span>
          </div>
        </div>

        <!-- Pin 3: Fleet Unit in Transit (Fontibón) -->
        <div class="map-pin pin-transit">
          <div class="pin-pulse pin-pulse-amber" data-layout-allow-overflow="true"></div>
          <div class="pin-marker pin-marker-amber"></div>
          <div class="pin-label-box" data-layout-ignore="true">
            <span class="pin-title">JCB 3CX EN TRÁNSITO</span>
            <span class="pin-status status-transit">VELOCIDAD: 42 KM/H • ETA 18 MIN</span>
          </div>
        </div>
      </div>

      <!-- Left HUD Overlay Card: PostGIS Geospatial Engine -->
      <div class="hud-panel-left" data-layout-allow-occlusion="true">
        <div class="hud-header">
          <span class="hud-status-dot"></span>
          <span class="hud-title" data-layout-ignore="true">POSTGIS TELEMETRY ENGINE</span>
        </div>
        <div class="hud-metric-row">
          <div class="hud-metric">
            <div class="metric-label" data-layout-ignore="true">RADIO AUTORIZADO</div>
            <div class="metric-val text-crimson">20.0 KM</div>
          </div>
          <div class="hud-metric">
            <div class="metric-label" data-layout-ignore="true">DISTANCIA HAVERSINE</div>
            <div class="metric-val text-amber">14.8 KM</div>
          </div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-metric-row">
          <div class="hud-metric">
            <div class="metric-label" data-layout-ignore="true">LATENCIA DE CÁLCULO</div>
            <div class="metric-val text-emerald">&lt; 14 MS</div>
          </div>
          <div class="hud-metric">
            <div class="metric-label" data-layout-ignore="true">ESTADO GEOFENCE</div>
            <div class="metric-val text-emerald">VALIDADO</div>
          </div>
        </div>
      </div>

      <!-- Right HUD Overlay Card: Machine Telemetry Preview -->
      <div class="hud-panel-right">
        <div class="machine-thumb-box">
          <img src="assets/img/jcb-3cx-4x4.jpg" alt="JCB 3CX 4x4" class="machine-thumb-img" />
          <div class="machine-badge" data-layout-ignore="true">EQUIPO ASIGNADO</div>
        </div>
        <div class="machine-info">
          <div class="machine-name" data-layout-ignore="true">JCB 3CX 4X4 TURBO</div>
          <div class="machine-category" data-layout-ignore="true">Retroexcavadora de Alta Productividad</div>
          <div class="machine-tag-row">
            <span class="tag-chip chip-green" data-layout-ignore="true">DISPONIBLE</span>
            <span class="tag-chip chip-blue" data-layout-ignore="true">CERTIFICADA RUNT</span>
          </div>
        </div>
      </div>

      <!-- Scene Header Banner -->
      <div class="scene-header">
        <div class="scene-tag" data-layout-ignore="true">MÓDULO DE GEOLOCALIZACIÓN</div>
        <h2 class="scene-title">Despacho Inteligente &amp; Cobertura en Tiempo Real</h2>
      </div>
    </div>

    <style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene2-gis-map"]';

        const header = `${scope} .scene-header`;
        const pulseRing = `${scope} .coverage-pulse-ring`;
        const solidRing = `${scope} .coverage-solid-ring`;
        const radarWave = `${scope} .center-radar-wave`;
        const haversineLine = `${scope} .haversine-line`;
        const pins = `${scope} .map-pin`;
        const hudLeft = `${scope} .hud-panel-left`;
        const hudRight = `${scope} .hud-panel-right`;

        // Initial setup
        tl.set(header, { opacity: 0, y: -20 });
        tl.set([pulseRing, solidRing], { scale: 0.1, transformOrigin: "960px 540px", opacity: 0 });
        tl.set(radarWave, { scale: 0.1, transformOrigin: "960px 540px", opacity: 0 });
        tl.set(haversineLine, { strokeDashoffset: 500, opacity: 0 });
        tl.set(pins, { opacity: 0, scale: 0.5, transformOrigin: "center center" });
        tl.set(hudLeft, { opacity: 0, x: -60 });
        tl.set(hudRight, { opacity: 0, x: 60 });

        // Animation Sequence
        tl.to(header, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);

        // Ring expands from center
        tl.to([pulseRing, solidRing], { scale: 1, opacity: 1, duration: 1.4, ease: "power3.out" }, 0.4);
        tl.to(radarWave, { scale: 2.2, opacity: 0.8, duration: 1.2, ease: "power2.out" }, 0.6);
        tl.to(radarWave, { opacity: 0, duration: 0.6 }, 1.8);

        // Pins drop in
        tl.to(`${scope} .pin-center`, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.8);
        tl.to(`${scope} .pin-transit`, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.1);
        tl.to(`${scope} .pin-site`, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.4);

        // Haversine vector connects Base to Site
        tl.to(haversineLine, { opacity: 1, strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.6);

        // HUD Panels slide in
        tl.to(hudLeft, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 1.8);
        tl.to(hudRight, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 2.0);

        // Map subtle pan/drift
        tl.to(`${scope} .map-svg`, { scale: 1.05, transformOrigin: "960px 540px", duration: 3.5, ease: "sine.inOut" }, 1.5);

        // Exit out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 5.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2-gis-map"] = tl;
      })();
    </script>
