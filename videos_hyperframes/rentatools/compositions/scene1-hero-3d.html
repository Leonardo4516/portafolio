    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene1-hero-3d"]';

        const frame = `${scope} .browser-frame`;
        const excavator = `${scope} .excavator-model-img`;
        const callout3D = `${scope} .callout-3d`;
        const calloutSearch = `${scope} .callout-search`;

        // Initial setup
        tl.set(frame, { opacity: 1, y: 0, scale: 1 });
        tl.set([callout3D, calloutSearch], { opacity: 0, scale: 0.8 });
        tl.set(excavator, { scale: 0.95, rotation: -1 });

        // 3D Model subtle rotation float
        tl.to(excavator, { scale: 1, rotation: 2, y: -10, duration: 2.5, ease: "sine.inOut" }, 0.5);

        // Callout 1 appears pointing to 3D
        tl.to(callout3D, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 1.2);

        // Camera punches in gently to highlight both features
        tl.to(frame, { scale: 1.05, transformOrigin: "70% 50%", duration: 1.8, ease: "power2.inOut" }, 1.8);

        // Callout 2 appears pointing to search
        tl.to(calloutSearch, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.4);

        // Zoom back out to full web view before transition
        tl.to(frame, { scale: 1, duration: 0.8, ease: "power2.inOut" }, 3.8);

        // Exit Out
        tl.to(`${scope} .canvas`, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 4.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-hero-3d"] = tl;
