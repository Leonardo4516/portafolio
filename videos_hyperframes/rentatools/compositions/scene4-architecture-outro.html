    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const scope = '[data-composition-id="scene4-architecture-outro"]';

        const header = `${scope} .scene-header`;
        const diagram = `${scope} .hex-diagram-wrapper`;
        const badges = `${scope} .adapter-badge`;
        const core = `${scope} .domain-core`;
        const outroCard = `${scope} .outro-card`;

        // Setup
        tl.set(header, { opacity: 0, y: -20 });
        tl.set(diagram, { opacity: 0, scale: 0.9 });
        tl.set(core, { opacity: 0, scale: 0.5 });
        tl.set(badges, { opacity: 0, y: 20 });
        tl.set(outroCard, { opacity: 0, x: 60, scale: 0.95 });

        // Sequence
        tl.to(header, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.to(diagram, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.4);
        tl.to(core, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.7);

        tl.to(badges, { opacity: 1, y: 0, duration: 0.5, stagger: 0.15, ease: "power2.out" }, 1.0);
        tl.to(outroCard, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: "back.out(1.1)" }, 1.4);

        // Core pulse
        tl.to(`${scope} .core-hex-polygon`, { strokeWidth: 5, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.8);

        // Final hold until 4.5s
        window.__timelines = window.__timelines || {};
        window.__timelines["scene4-architecture-outro"] = tl;
      })();
