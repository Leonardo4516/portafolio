<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>RentaTools Pro - Showcase Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #08090d;
        font-family: "Inter", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .caption-text-wrapper {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 50;
      }
      .caption-pill {
        background: rgba(8, 10, 16, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        padding: 14px 36px;
        border-radius: 9999px;
        backdrop-filter: blur(12px);
      }
      .caption-line {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
        text-align: center;
        opacity: 0;
        transform: translateY(20px);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Hero Intro (CAT 320D & Specs) -->
      <div
        id="scene-1"
        class="scene"
        data-composition-id="scene1-hero-intro"
        data-composition-src="compositions/scene1-hero-intro.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: GIS Map & Geofencing -->
      <div
        id="scene-2"
        class="scene"
        data-composition-id="scene2-gis-map"
        data-composition-src="compositions/scene2-gis-map.html"
        data-start="4.5"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Catalog & Anti-Collision Booking -->
      <div
        id="scene-3"
        class="scene"
        data-composition-id="scene3-catalog-booking"
        data-composition-src="compositions/scene3-catalog-booking.html"
        data-start="10"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Hexagonal Architecture DDD & Outro -->
      <div
        id="scene-4"
        class="scene"
        data-composition-id="scene4-architecture-outro"
        data-composition-src="compositions/scene4-architecture-outro.html"
        data-start="15.5"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Synchronized Dynamic Captions -->
      <div
        id="captions-comp"
        data-track-kind="captions"
        data-composition-id="captions"
        data-start="0"
        data-duration="20"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      >
        <div class="caption-text-wrapper">
          <div class="caption-pill">
            <div id="caption-text" class="caption-line">RentaTools Pro: Marketplace B2B de maquinaria pesada.</div>
          </div>
        </div>

        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });
            const text = document.querySelector("#caption-text");

            // Caption 1: 0.5s - 4.1s
            tl.set(text, { innerText: "RentaTools Pro: Marketplace B2B de maquinaria pesada en tiempo real.", y: 20 }, 0.4);
            tl.to(text, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
            tl.to(text, { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" }, 4.1);

            // Caption 2: 4.6s - 9.6s
            tl.set(text, { innerText: "Geolocalización en vivo y despacho inteligente con radio de cobertura de 20 km.", y: 20 }, 4.6);
            tl.to(text, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.6);
            tl.to(text, { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" }, 9.6);

            // Caption 3: 10.1s - 15.1s
            tl.set(text, { innerText: "Validación concurrente de disponibilidad y prevención estricta de solapes.", y: 20 }, 10.1);
            tl.to(text, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.1);
            tl.to(text, { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" }, 15.1);

            // Caption 4: 15.6s - 19.6s
            tl.set(text, { innerText: "Arquitectura hexagonal en Java 21 y Spring Boot 3.4 lista para producción.", y: 20 }, 15.6);
            tl.to(text, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 15.6);
            tl.to(text, { opacity: 0, y: -15, duration: 0.4, ease: "power2.in" }, 19.6);

            window.__timelines = window.__timelines || {};
            window.__timelines["captions"] = tl;
          })();
        </script>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
